<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Apuntar partido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Manrope:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A33}a:hover{color:#FFB070}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0A1020; color: #F2F5FA; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between">
<a href="#" aria-label="Cerrar" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #121D33; color: #F2F5FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Apuntar partido</h1>
<span style="width: 44px"></span>
</div>

<div style="padding: 8px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 12px; color: #9AA8BD; text-transform: uppercase; letter-spacing: 1px; font-weight: 700">Modalidad</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ modes }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pf-rival" style="font-size: 12px; color: #9AA8BD; text-transform: uppercase; letter-spacing: 1px; font-weight: 700">Rival</label>
<input id="pf-rival" value="Marc" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #2E4366; background: #0D1628; color: #F2F5FA; font: 600 16px Manrope, sans-serif">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 12px; color: #9AA8BD; text-transform: uppercase; letter-spacing: 1px; font-weight: 700">Puntos por set</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ points }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 12px; color: #9AA8BD; text-transform: uppercase; letter-spacing: 1px; font-weight: 700">Sets</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ sets }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
</div>
</div>

<div style="padding: 14px 16px; border-radius: 16px; background: #0D1628; border: 1px solid #1C2A44; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #9AA8BD; font-weight: 700"><span>Set</span><span>Tú · Rival</span></div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">1</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700"><span style="color: #FF6B6E">{{ s1a }}</span> – <span style="color: #5AA2FF">{{ s1b }}</span></span></div>
<sc-if value="{{ multi }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">2</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700"><span style="color: #FF6B6E">{{ s2a }}</span> – <span style="color: #5AA2FF">{{ s2b }}</span></span></div>
</sc-if>
<button style="min-height: 44px; border-radius: 12px; border: 1.5px dashed #2E4366; background: transparent; color: #C9D3E3; font: 700 14px Manrope, sans-serif">+ Añadir set</button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px; background: #121D33">
<span style="font-size: 14px; color: #C9D3E3">Peso del formato</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #FF8A33">m = {{ mult }}</span>
</div>
</div>

<div style="margin-top: auto; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 8px">
<button style="min-height: 56px; border: 0; border-radius: 999px; background: #FF7A1A; color: #0A1020; font: 800 16px Manrope, sans-serif">Enviar a Marc para confirmar</button>
<p style="margin: 0; text-align: center; font-size: 12px; color: #9AA8BD">Sin su confirmación en 48 h, el partido caduca.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: '1v1', pts: 11, sets: 3 }; }
  renderVals() {
    var self = this;
    var on = 'min-height: 48px; border: 0; border-radius: 14px; background: #FF7A1A; color: #0A1020; font: 800 15px Manrope, sans-serif; cursor: pointer';
    var off = 'min-height: 48px; border: 1.5px solid #2E4366; border-radius: 14px; background: #0D1628; color: #F2F5FA; font: 700 15px Manrope, sans-serif; cursor: pointer';
    function opts(list, key, fmt) {
      return list.map(function (v) {
        var sel = self.state[key] === v;
        return { label: fmt(v), on: sel, style: sel ? on : off, pick: function () { var s = {}; s[key] = v; self.setState(s); } };
      });
    }
    var p = this.state.pts, n = this.state.sets;
    var toWin = (n + 1) / 2;
    var m = Math.min(1, Math.sqrt((p * toWin) / 33));
    var win = p, lose = Math.max(0, p - 3);
    return {
      modes: opts(['1v1', '2v2'], 'mode', function (v) { return v; }),
      points: opts([5, 7, 11, 21], 'pts', function (v) { return 'a ' + v; }),
      sets: opts([1, 3, 5, 7], 'sets', function (v) { return v === 1 ? '1 set' : 'Bo' + v; }),
      multi: n > 1,
      s1a: win, s1b: lose, s2a: Math.max(0, p - 2), s2b: p,
      mult: m.toFixed(2).replace('.', ',')
    };
  }
}
</script>
</body>
</html>
